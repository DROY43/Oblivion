[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oblivion-65536"
version = "0.1.0"
description = "Experimental encryption research toolkit: one-time pad and AES-256-GCM vault modes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0.0"]

[project.scripts]
oblivion = "oblivion.cli:main"

[tool.setuptools.packages.find]
include = ["oblivion*"]
